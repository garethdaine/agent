name: Docs Deploy Sync Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - config/documentation.php
      - docs/**
      - scripts/docs/**
      - .githooks/pre-commit
      - .claude/hooks/pre-commit
      - .codex/hooks/pre-commit
      - .github/workflows/docs-deploy-sync.yml

jobs:
  docs-sync-deploy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pinned to v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # pinned to v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Deploy docs sync gate
        run: php artisan docs:sync --mode=deploy --source=repo

